name: AnimeOri Telegram Feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-feed-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Run Telegram feed script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EPISODES_FEED_URL: ${{ secrets.EPISODES_FEED_URL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://animeori.edgeone.dev' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://animeori.ai.studio' }}
          TELEGRAM_GROUP_URL: ${{ secrets.TELEGRAM_GROUP_URL }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        run: python feed_bot.py

      - name: Commit updated seen_episodes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_episodes.json
          if ! git diff --staged --quiet; then
            git commit -m "Update seen_episodes.json"
            git push
          else
            echo "Nessuna modifica a seen_episodes.json"
          fi
